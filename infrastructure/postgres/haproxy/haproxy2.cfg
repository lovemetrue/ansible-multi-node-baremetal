global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5000
    timeout client 50000
    timeout server 50000


### PostgreSQL ###
listen postgres_master
    bind master.sale.elewise.com:5000
    option tcplog
    option httpchk OPTIONS /master
    http-check expect status 200
    default-server inter 3s fastinter 1s fall 3 rise 4 on-marked-down shutdown-sessions
    server k8s-postgres.elewise.local k8s-postgres.elewise.local:6432 check port 8008
    server k8s-postgres-s1.elewise.local k8s-postgres-s1.elewise.local:6432 check port 8008
    server k8s-postgres-m2.elewise.local k8s-postgres-m2.elewise.local:6432 check port 8008 

    

listen postgres_replicas
    bind master.sale.elewise.com:5001
    option tcplog
    option httpchk OPTIONS /replica
    balance roundrobin
    http-check expect status 200
    default-server inter 3s fastinter 1s fall 3 rise 2 on-marked-down shutdown-sessions
    server k8s-postgres.elewise.local k8s-postgres.elewise.local:6432 check port 8008
    server k8s-postgres-s1.elewise.local k8s-postgres-s1.elewise.local:6432 check port 8008
    server k8s-postgres-m2.elewise.local k8s-postgres-m2.elewise.local:6432 check port 8008 
